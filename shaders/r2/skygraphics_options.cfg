/*
Описание параметров.

#define IMPROVED_MBLUR
	Включает/выключает усовершенствованный Motion Blur. Для включения надо раскомментировать эту строку, например:
#define IMPROVED_MBLUR
Для выключения - надо закомментировать:
//#define IMPROVED_MBLUR

#define MBLUR_SAMPLES 	int(10)
	Параметр для Motion Blur`а, определяет интенсивность эффекта. Чем больше значение тем большая интенсивность. Влияет на производительность. Параметр не может принимать дробных значений.

#define SCALE_X float(-0.03)
#define SCALE_Y float(0.03)
#define VEL_START float(0.009) 
#define VEL_FIN float(0.02) 
#define IMB_CLAMP float(0.01)
	Параметры для Motion Blur`а, отвечают за характер размытия картинки. Не рекомендуется их менять.

#define START_DIST float(0.7)
#define FINAL_DIST float(1.3)
	Параметры для Motion Blur`а, определяют расстояние с которого включается Motion Blur (START_DIST), и расстояние с которого начинается полное размытие (FINAL_DIST). Между START_DIST и FINAL_DIST происходит плавный переход от не размытой области к размытой. Параметры условно измеряются в метрах.

#define DEPTH_OF_FIELD
	Включает/выключает эффект Depth Of Field. Для включения надо раскомментировать эту строку, например:
#define DEPTH_OF_FIELD
Для выключения - надо закомментировать:
//#define DEPTH_OF_FIELD

#define DOF_QUALITY int(12)
	Параметр для Depth Of Field, определяет качество эффекта. Влияет на производительность. Параметр не может принимать дробных значений.

#define MINDIST float(0.4)
#define MAXDIST float(130)
	Параметры для Depth Of Field, определяют расстояние с которого включается Depth Of Field (MINDIST), и расстояние с которого начинается полное размытие (MAXDIST). Параметры условно измеряются в метрах.

#define MAXCOF	float(3)
	Параметр для Depth Of Field, определяет степень размытия эффекта.

#define MAX_SAMPLES int(40)
#define MIN_SAMPLES int(5)
	Параметры для Parallax Occlusion, определяют количество текстурных выборок. Чем их больше, тем качественнее эффект. Влияет на производительность. Параметры не могут принимать дробных значений.

#define PARALLAX_OFFSET float(0.015)
	Параметр для Paralax Occlusion, определяет высоту поверхности(степень смещения). Чем больше значение, тем больше высота.

#define FINAL_INTERSECTION_LOOPS int(5)
	Параметр для Parallax Occlusion, определяет количиство циклов для нахождения точки пересечения. Чем их больше тем качественнее эффект. Влияет на производительность. Параметр не может принимать дробных значений.

#define CORRECT_PERSPECTIVE
	Параметр для Parallax Occlusion, включает/выключает более правильную перспективу на острых углах геометрии. Повышает иллюзию смещения. Требует более высоких значений для MAX_SAMPLES и MIN_SAMPLES. Из-за особенностей игровой геометрии сталкера, на некоторых поверхностях появляются артефакты, в виде искажений. Для включения надо раскомментировать эту строку, например:
#define CORRECT_PERSPECTIVE
Для выключения - надо закомментировать:
//#define CORRECT_PERSPECTIVE

#define CONTRAST_COEF_Q1 float(0.6)
#define CONTRAST_COEF_Q2 float(1)
#define BRIGHTNESS_COEF float(0.25)
	Параметры для Parallax Occlusion, используются в алгоритме повышения контрастности карт высот. Не рекомендуется их менять.
